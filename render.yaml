# Render Blueprint — live verification (RWA_USE_FIXTURES=0).
# https://render.com/docs/blueprint-spec
#
# Render must stay at RWA_USE_FIXTURES=0 so live Chainlink PoR
# checks run. Blueprint sync re-applies this file and will overwrite a
# dashboard-only toggle. CMC_API_KEY must be set in the Render dashboard
# (sync: false) for live CMC. Never commit the key. Local demos can still
# set RWA_USE_FIXTURES=1.
# Optional: POLYGON_RPC_URL / BASE_RPC_URL / ETH_RPC_URL in the dashboard
# (public no-key fallbacks are used when unset).
#
# Start Command: the dashboard value is independent of this file unless the
# service is Blueprint-synced. It MUST stay `python -m rwa_score.health …`.
# `streamlit run app.py` serves Streamlit SPA HTML at GET /health, /privacy,
# and /terms (content-type text/html). `/_stcore/health` is Streamlit's own
# probe and will still return `ok` in that case — that is not this payload.
# This repo cannot change the Render dashboard. If live /health is HTML,
# edit Settings → Start Command to match startCommand below. Do not treat
# a merge as a deploy.

services:
  - type: web
    name: rwa-transparency-score
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -m rwa_score.health
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    envVars:
      # 0 = live Chainlink PoR feeds; 1 = offline demo fixtures only
      - key: RWA_USE_FIXTURES
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CMC_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      # Signed share-card HMAC. Never commit. Set in the dashboard / Bitwarden.
      - key: SCORE_CARD_SIGNING_SECRET
        sync: false
      # X API v2 OAuth 1.0a user tokens. All four required to post.
      # Missing any of these skips the X post (missing-credentials copy).
      # If all four are set and upload/tweet still fails, UI shows the
      # X-API-failure skip; Render logs get X_SHARE_FAIL (not the UI).
      # PNG download still works either way.
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false

  # Second web service so /v1 is JSON. The scorecard service above stays
  # on `python -m rwa_score.health`. This file does not create or deploy
  # the service; Spencer applies the blueprint (or copies these settings)
  # himself. Secrets are sync:false — set them in the dashboard, never here.
  # Free plan: idle spin-down drops the sqlite file (payloads, queue, keys).
  # A background worker or paid disk is not declared in this file.
  - type: web
    name: rwa-transparency-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m rwa_score.api
    healthCheckPath: /health
    envVars:
      - key: RWA_USE_FIXTURES
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RWA_ATTESTATION_CONTRACT
        value: "0x2F073a3628D498d92956e7eFE2b26633eDa75b00"
      - key: RWA_ATTESTATION_CHAIN
        value: base-sepolia
      - key: RWA_ATTESTATION_CHAIN_ID
        value: "84532"
      - key: RWA_ATTEST_VALUE_CAP_WEI
        value: "0"
      - key: RWA_ATTEST_GAS_LIMIT
        value: "300000"
      - key: RWA_ATTEST_MAX_ATTEMPTS
        value: "5"
      - key: RWA_ATTEST_BACKOFF_SECONDS
        value: "2.0"
      - key: RWA_API_BOOTSTRAP_TIER
        value: paid
      - key: RWA_API_DB_PATH
        value: data/rat_api.sqlite
      - key: CMC_API_KEY
        sync: false
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
      - key: RWA_ATTESTER_PRIVATE_KEY
        sync: false
      - key: RWA_API_BOOTSTRAP_KEY
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: ETH_RPC_URL
        sync: false
