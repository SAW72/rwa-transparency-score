[server]
headless = true
enableXsrfProtection = true

[client]
# Privacy / Terms stay reachable via sidebar + footer links (and /privacy, /terms).
# The auto multipage list was extra chrome on top of those links.
showSidebarNavigation = false

[theme]
primaryColor = "#3DDC97"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
