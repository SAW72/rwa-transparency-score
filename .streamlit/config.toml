[server]
headless = true
enableXsrfProtection = true
# Render Start Command must be `python -m rwa_score.health …`, not `streamlit run`.
# `streamlit run app.py` leaves cold-start GET /health as Streamlit SPA HTML.

[client]
# Privacy / Terms stay reachable via sidebar + footer links (and /privacy, /terms).
# The auto multipage list was extra chrome on top of those links.
showSidebarNavigation = false

[theme]
primaryColor = "#3DDC97"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
