[server]
headless = true
enableXsrfProtection = true
# Render Start Command must be `python -m rwa_score.health …`, not `streamlit run`.
# `streamlit run app.py` leaves cold-start GET /health as Streamlit SPA HTML.

[client]
# Privacy / Terms are Tornado HTML at /privacy and /terms (health launcher).
# Do not add a pages/ directory — that forces Streamlit MPA v1, which treats
# /component, /media, and /_stcore/download as unknown pages (Share FAIL).
showSidebarNavigation = false

[theme]
primaryColor = "#3DDC97"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
