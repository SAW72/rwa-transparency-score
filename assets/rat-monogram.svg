<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RAT Score">
  <title>RAT Score</title>
  <!-- Geometric R-A-T monogram: radar/meter energy, not a cartoon rat.
       Look source files were not on this VM; this is a clean dark-theme placeholder. -->
  <defs>
    <clipPath id="chip">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>
  <g clip-path="url(#chip)">
    <rect width="512" height="512" rx="104" fill="#161B22"/>
    <g fill="none" stroke="#3DDC97" stroke-linecap="round">
      <circle cx="256" cy="256" r="208" stroke-width="6" stroke-opacity="0.23"/>
      <circle cx="256" cy="256" r="150" stroke-width="5" stroke-opacity="0.18"/>
      <circle cx="256" cy="256" r="92" stroke-width="4" stroke-opacity="0.14"/>
      <line x1="256" y1="256" x2="410.6" y2="116.7" stroke-width="3" stroke-opacity="0.31"/>
    </g>
    <circle cx="256" cy="256" r="8" fill="#3DDC97"/>
    <text x="256" y="276" text-anchor="middle" fill="#3DDC97"
          font-family="DejaVu Sans, Inter, ui-sans-serif, sans-serif"
          font-size="156" font-weight="700">RAT</text>
    <rect x="7" y="7" width="498" height="498" rx="94" fill="none"
          stroke="#3DDC97" stroke-width="6" stroke-opacity="0.59"/>
  </g>
</svg>
