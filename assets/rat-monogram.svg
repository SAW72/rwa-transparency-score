<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RAT Score">
  <title>RAT Score</title>
  <!-- Look monogram: white R-A-T on mint radar rings. Not a cartoon rat. -->
  <defs>
    <clipPath id="chip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#chip)">
    <rect width="512" height="512" rx="112" fill="#0B0E14"/>
    <g fill="none" stroke="#3DDC97" stroke-linecap="round">
      <circle cx="256" cy="256" r="208" stroke-width="5" stroke-opacity="0.37"/>
      <circle cx="256" cy="256" r="148" stroke-width="4" stroke-opacity="0.31"/>
      <circle cx="256" cy="256" r="88" stroke-width="3" stroke-opacity="0.24"/>
      <line x1="256" y1="256" x2="395.2" y2="101.4" stroke-width="5" stroke-opacity="0.67"/>
    </g>
    <text x="256" y="278" text-anchor="middle" fill="#F2F4F7"
          font-family="DejaVu Sans, Inter, ui-sans-serif, sans-serif"
          font-size="168" font-weight="700">RAT</text>
    <rect x="8" y="8" width="496" height="496" rx="104" fill="none"
          stroke="#3DDC97" stroke-width="8"/>
  </g>
</svg>
